<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InBalance - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background-color: #f4f7f6;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        width: 100%;
        max-width: 400px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      }
    </style>
  </head>
  <body>

    <div class="card login-card p-4 bg-white">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">InBalance</h3>
        <p class="text-muted small">Ingresa tus credenciales para continuar</p>
      </div>

      {% if form.errors %}
        <div class="alert alert-danger py-2 small">
          Usuario o contraseña incorrectos. Inténtalo de nuevo.
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">Nombre de Usuario</label>
          <input type="text" name="username" class="form-control" placeholder="Ej: admin" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold">Contraseña</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold">
          Iniciar Sesión
        </button>
      </form>
    </div>

  </body>
</html>
